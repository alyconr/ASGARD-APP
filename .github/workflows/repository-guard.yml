name: Repository Guard

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'test/**'
      - 'docs/**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  verify-context:
    name: Verify ASGARD Repository Context
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Repository Context Guard
        run: |
          python scripts/assert_asgard_context.py --json
