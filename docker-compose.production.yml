services:
  asgard-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - asgard-frontend
      - asgard-backend
      - asgard-minio
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${MINIO_CONSOLE_PORT:-9001}:81"
    volumes:
      - ./deploy/production/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/production/nginx.htpasswd:/etc/nginx/.htpasswd:ro

  asgard-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "/api/v1"
        NEXT_PUBLIC_APP_ENV: "production"
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
    depends_on:
      - asgard-backend

  asgard-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      APP_NAME: "SENA Guia Aprendizaje API"
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-sena_guias}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}@asgard-postgres:5432/${POSTGRES_DB:-sena_guias_db}"
      ALEMBIC_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-sena_guias}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}@asgard-postgres:5432/${POSTGRES_DB:-sena_guias_db}"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
      STORAGE_PROVIDER: minio
      STORAGE_BUCKET_NAME: "${STORAGE_BUCKET_NAME:-sena-programa-documentos}"
      STORAGE_ENDPOINT: "asgard-minio:9000"
      STORAGE_ACCESS_KEY: "${MINIO_ROOT_USER:?MINIO_ROOT_USER requerido}"
      STORAGE_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requerido}"
      STORAGE_SECURE: "false"
    depends_on:
      asgard-postgres:
        condition: service_healthy
      asgard-minio:
        condition: service_healthy

  asgard-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sena_guias_db}
      POSTGRES_USER: ${POSTGRES_USER:-sena_guias}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sena_guias} -d ${POSTGRES_DB:-sena_guias_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  asgard-minio:
    image: quay.io/minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER requerido}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requerido}
      MINIO_BROWSER_REDIRECT_URL: "http://${PUBLIC_HOST:-localhost}:${MINIO_CONSOLE_PORT:-9001}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
